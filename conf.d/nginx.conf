# 別サイト用 nginx.conf
# 元の本家 nginx.conf から SSI / Telemetry(SSE) 系を除去し、
# ブログで適用済みのセキュリティヘッダーを最初から入れた版

# テキスト系コンテンツの圧縮
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/xml text/xml;

# nginx のバージョンを出さない
server_tokens off;

server {
    # Dockerネットワークからのプロキシヘッダーを信用する設定
    set_real_ip_from 172.16.0.0/12;  # Dockerのサブネット範囲
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # セキュリティヘッダー（ブログで適用済みのもの。CSPは新サイトの
    # 使用フォント・inline有無を見てから別途追加する）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        # 存在しないURLに直アクセスされた際も index.html を返す設定（SPAルーティング用）
        try_files $uri $uri/ /index.html;
    }

    # ★ config*.json への直接URLアクセスを拒否
    # 元は SSI 内部からの呼び出しのみ許可（internal）だったが、
    # SSI を使わないので内部の呼び出し元も無く、丸ごと 404 に変更
    location ~* ^/config.*\.json$ {
        return 404;
    }

    # Python スクリプトの直接ダウンロードを遮断
    location ~* \.py$ {
        return 404;
    }

    # ★ serverInfo/ も元は SSI 用（internal）。SSI廃止に伴い丸ごと 404
    location ^~ /serverInfo/ {
        return 404;
    }

    # キャッシュの設定（アニメーション資材等の読み込み最適化）
    # ※ add_header を書いた location では親のヘッダーが継承されないため付け直す
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
